    <path d="M32 40 C28 65, 30 85, 36 95 C40 85, 42 70, 42 55 Z" fill="#171210"/>
    <path d="M88 40 C92 65, 90 85, 84 95 C80 85, 78 70, 78 55 Z" fill="#171210"/>
