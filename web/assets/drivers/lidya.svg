<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="lidya-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="lidya-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9d6742"/>
      <stop offset="100%" stop-color="#7d4e2c"/>
    </linearGradient>
    <clipPath id="circle-clip-lidya">
      <circle cx="60" cy="60" r="56"/>
    </clipPath>
  </defs>
  <circle cx="60" cy="60" r="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
