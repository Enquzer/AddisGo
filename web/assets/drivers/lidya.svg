    <path d="M46 48 Q50 47 54 49" stroke="#171210" stroke-width="1.2" fill="none"/>
    <ellipse cx="71" cy="50" rx="3.5" ry="2.3" fill="#ffffff"/>
    <circle cx="70.5" cy="50" r="1.8" fill="#171210"/>
    <circle cx="71" cy="49.5" r="0.6" fill="#ffffff"/>
    <path d="M66 49 Q70 47 74 48" stroke="#171210" stroke-width="1.2" fill="none"/>
    <!-- Nose -->
    <path d="M58 50 L57 59 C57 61, 63 61, 63 59 L62 50" stroke="#673d1f" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- Lips with warm smile -->
    <path d="M52 65 Q60 69 68 65" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M51 64 Q60 66 69 64 Q60 72 51 64 Z" fill="#a84343" opacity="0.85"/>
