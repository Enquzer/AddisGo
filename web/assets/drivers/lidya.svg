    <path d="M36 44 C34 26, 48 18, 60 18 C72 18, 86 26, 84 44 C76 34, 66 32, 60 34 C54 32, 44 34, 36 44 Z" fill="#171210"/>
    <path d="M37 42 C44 34, 52 38, 55 45 C48 42, 42 45, 37 42 Z" fill="#221a17"/>
    <path d="M83 42 C76 34, 68 38, 65 45 C72 42, 78 45, 83 42 Z" fill="#221a17"/>
    <!-- Eyebrows -->
    <path d="M45 45 Q51 41 55 45" stroke="#171210" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M65 45 Q69 41 75 45" stroke="#171210" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Eyes -->
    <ellipse cx="49" cy="50" rx="3.5" ry="2.3" fill="#ffffff"/>
    <circle cx="49.5" cy="50" r="1.8" fill="#171210"/>
    <circle cx="50" cy="49.5" r="0.6" fill="#ffffff"/>
