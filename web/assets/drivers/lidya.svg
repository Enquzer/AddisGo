    <ellipse cx="40" cy="54" rx="3.5" ry="5.5" fill="#7d4e2c"/>
    <ellipse cx="80" cy="54" rx="3.5" ry="5.5" fill="#7d4e2c"/>
    <circle cx="40" cy="58" r="2.2" fill="#f59e0b"/>
    <circle cx="80" cy="58" r="2.2" fill="#f59e0b"/>
