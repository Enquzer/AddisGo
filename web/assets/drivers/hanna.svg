    <!-- Hair back -->
    <path d="M30 42 C26 62, 28 80, 36 90 C40 80, 42 66, 42 52 Z" fill="#140f0d"/>
    <path d="M90 42 C94 62, 92 80, 84 90 C80 80, 78 66, 78 52 Z" fill="#140f0d"/>
