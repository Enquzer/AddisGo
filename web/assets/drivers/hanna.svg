      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="hanna-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8e5a36"/>
      <stop offset="100%" stop-color="#704223"/>
    </linearGradient>
    <clipPath id="circle-clip-hanna">
      <circle cx="60" cy="60" r="56"/>
    </clipPath>
  </defs>
  <circle cx="60" cy="60" r="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
