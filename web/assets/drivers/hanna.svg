    <path d="M52 70 L52 88 C52 94, 68 94, 68 88 L68 70 Z" fill="#704223"/>
    <!-- Head -->
    <ellipse cx="60" cy="52" rx="20" ry="24" fill="url(#hanna-skin)"/>
    <!-- Ears -->
    <ellipse cx="40" cy="54" rx="3.5" ry="5.5" fill="#704223"/>
    <ellipse cx="80" cy="54" rx="3.5" ry="5.5" fill="#704223"/>
    <!-- Hair front -->
    <path d="M35 44 C33 26, 48 18, 60 18 C72 18, 87 26, 85 44 C77 34, 66 32, 60 34 C54 32, 43 34, 35 44 Z" fill="#140f0d"/>
    <!-- Eyebrows -->
    <path d="M45 45 Q51 42 55 45" stroke="#140f0d" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M65 45 Q69 42 75 45" stroke="#140f0d" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Eyes -->
    <ellipse cx="49" cy="50" rx="3.5" ry="2.3" fill="#ffffff"/>
    <circle cx="49.5" cy="50" r="1.8" fill="#140f0d"/>
    <circle cx="50" cy="49.5" r="0.6" fill="#ffffff"/>
    <ellipse cx="71" cy="50" rx="3.5" ry="2.3" fill="#ffffff"/>
    <circle cx="70.5" cy="50" r="1.8" fill="#140f0d"/>
    <circle cx="71" cy="49.5" r="0.6" fill="#ffffff"/>
    <!-- Nose -->
    <path d="M58 50 L57 59 C57 61, 63 61, 63 59 L62 50" stroke="#5c3419" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- Smile -->
    <path d="M52 65 Q60 70 68 65" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M51 64 Q60 66 69 64 Q60 72 51 64 Z" fill="#b91c1c" opacity="0.8"/>
